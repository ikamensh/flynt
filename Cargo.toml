[package]
name = "flynt-rs"
version = "2.0.0-beta.1"
edition = "2021"
description = "flynt: convert %-format and .format() strings to f-strings (Rust implementation)"
license = "MIT"

[[bin]]
name = "flynt"
path = "src/main.rs"

[dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.14.11" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.14.11" }
ruff_python_codegen = { git = "https://github.com/astral-sh/ruff", tag = "0.14.11" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.14.11" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.14.11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
similar = "2"
rayon = "1"

[profile.release]
lto = true
