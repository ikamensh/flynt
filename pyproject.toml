[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "flynt"
# Version derived from Cargo.toml by maturin (2.0.0-beta.1 -> 2.0.0b1).
dynamic = ["version"]
description = "CLI tool to convert a python project's %-formatted strings to f-strings."
readme = "README.md"
license = { text = "MIT" }
# The wheel ships a native binary; no Python runtime requirement of its own.
requires-python = ">=3.9"
authors = [
    { name = "Ilya Kamenshchikov" },
]
keywords = [
    "strings",
    "utility",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ikamensh/flynt"

[tool.maturin]
bindings = "bin"
# Ships a tiny `flynt` python package next to the binary (uv/ruff pattern):
# `python -m flynt` execs the binary; `import flynt` explains the API removal.
python-source = "python"

[tool.codespell]
# Rust identifiers and README wording, not typos.
ignore-words-list = ["hass", "thats", "ser", "clen", "nd", "unparseable"]
